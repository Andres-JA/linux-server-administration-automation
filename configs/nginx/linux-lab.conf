server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/linux-lab;
    index index.html;
    access_log /var/log/nginx/linux-lab.access.log;
    error_log /var/log/nginx/linux-lab.error.log;

    location / {
        try_files $uri $uri/ =404;
    }
}
